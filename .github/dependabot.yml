version: 2

# Two ecosystems, because the workflows pin their actions to a commit SHA and a pinned SHA
# that nobody updates is an old action nobody notices. Dependabot rewrites the SHA and the
# version comment beside it together, so the pin stays readable.
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # A week between a release and the pull request for it. Long enough that a package
    # yanked or patched hours after publishing never reaches this repository, short enough
    # that a security fix is not sitting in a queue.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # The JavaScript here is test tooling only - nothing in `resources/js` is bundled or
  # published - so this keeps the runner current rather than anything a project installs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
