name: run-tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.4', '8.3', '8.2']
        laravel: ['^11.0', '^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        exclude:
          # Laravel 13 requires PHP 8.3.
          - laravel: '^13.0'
            php: '8.2'
        include:
          - laravel: '^11.0'
            testbench: '^9.0'
          - laravel: '^12.0'
            testbench: '^10.0'
          - laravel: '^13.0'
            testbench: '^11.0'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite, pdo_sqlite, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          # Composer refuses to install a version carrying a security advisory. Laravel 11
          # currently has one that covers the whole major (PKSA-mdq4-51ck-6kdq, no fixed
          # 11.x release), so with the block in place the L11 matrix legs cannot resolve at
          # all and the suite goes untested there. Testing a supported major against a
          # disclosed framework advisory is the lesser evil in a CI matrix; it is not a
          # judgement that this package is unaffected, and it applies to nobody's install
          # but this runner's.
          composer config --no-plugins policy.advisories.block false
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest

  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The matrix above runs on SQLite, which is right for it: sixteen legs, no server to
    # wait for. But `docs/documentation.md` promises contributors that MySQL and Postgres
    # work, and a driver is not an implementation detail - `LIKE` escaping, collation and
    # case sensitivity all differ. This job keeps that promise honest without multiplying
    # sixteen legs by three: one PHP, one Laravel, two real servers.
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            port: 3306
            username: root
            password: secret
          - db: pgsql
            port: 5432
            username: postgres
            password: secret

    name: ${{ matrix.db }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -psecret"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: testing
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, sqlite, pdo_sqlite, pdo_mysql, pdo_pgsql, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: testing
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: ${{ matrix.password }}
        run: vendor/bin/pest
