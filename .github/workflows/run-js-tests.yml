name: run-js-tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    name: JavaScript

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These modules are hand-written and loaded verbatim, so there is no bundler and no
      # compiler between a typo and the browser. Twenty-four of them have no test at all;
      # the linter is the only thing that reads those files before an install does.
      - name: Lint
        run: npm run lint

      - name: Execute tests
        run: npm test
